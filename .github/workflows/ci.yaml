
name: Gitleaks Secret Scan

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

permissions: # it allows action to request JWT token
  id-token: write
  contents: read

jobs:

  # scan:
  #   name: Scan the repository
  #   runs-on: ubuntu-latest

  #   steps:
  #     - name: Checkout the repository
  #       uses: actions/checkout@v3
  #       with:
  #         fetch-depth: 0

  #     - name: Gitleaks scan
  #       uses: gitleaks/gitleaks-action@v3
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  first:
   name: tets
   runs-on: ubuntu-latest

   steps:
    - name : echo
      run: echo "tets"


  iac:
    name: Fetch AWS credentials for Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform_security/vault/

    steps:
      - name: Checkout the code
        uses: actions/checkout@v3


      - name: Check GitHub OIDC claims
        run: |
           TOKEN=$(curl -sS \
           -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
           "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fgithub.com%2Fdevops-harsh" \
            | jq -r '.value')

           echo "$TOKEN" | cut -d '.' -f2 | \
           tr '_-' '/+' | base64 -d 2>/dev/null | jq '{iss, aud, sub}'


      - name: Fetch AWS credentials from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: http://154.61.75.245:8200
          method: jwt
          role: gh-actions-role
          jwtGithubAudience: https://github.com/devops-harsh
          secrets: |
            aws/creds/terraform-role access_key | AWS_ACCESS_KEY_ID ;
            aws/creds/terraform-role secret_key | AWS_SECRET_ACCESS_KEY

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
