repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
    -   id: black

-   repo: https://github.com/gitleaks/gitleaks # to check the secret is hardcoded
    rev: v8.30.0
    hooks:
      - id: gitleaks
